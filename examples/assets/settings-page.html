<!doctype html><html><head><meta charset="utf-8"><style>
body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #f6f6f4; color: #222; }
.card { width: 560px; margin: 24px; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 22px 26px; }
h2 { margin: 0 0 4px; font-size: 19px; } .sub { color: #777; margin: 0 0 18px; }
.r { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid #eee; }
.r span { color: #777; } .ok { color: #2f8f5b; font-weight: 600; } .warn { color: #c9414a; font-weight: 600; }
button { margin-top: 16px; background: #222; color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-size: 14px; }
</style></head><body><div class="card">
<h2>Release check</h2><p class="sub">Version 4.2 against 4.1, last 24 hours</p>
<div class="r"><b>Checkout errors</b><span class="ok">0.2% &nbsp;pass</span></div>
<div class="r"><b>Page load time</b><span class="ok">1.4 s &nbsp;pass</span></div>
<div class="r"><b>Failed payments</b><span class="warn">3.1% &nbsp;fail</span></div>
<div class="r"><b>Search clicks</b><span class="ok">+2% &nbsp;pass</span></div>
<button>Roll back</button></div></body></html>
